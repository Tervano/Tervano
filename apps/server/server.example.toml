# Copy to server.toml. All fields optional; defaults shown.
listen = "127.0.0.1:8470"
database_url = "sqlite://tervano.db?mode=rwc"
# A device with no event for this long is shown offline. Keep > agent heartbeat_secs * 2.
offline_after_secs = 180
# Device event snapshots are purged on server start and hourly using server receipt time.
# Lowering this also removes existing events older than the new window at next start.
event_retention_days = 30
# Limits apply per socket peer. Behind a reverse proxy, size these for all traffic
# from that proxy and enforce client-aware limits at the proxy.
requests_per_second = 100
enrollments_per_minute = 60
# TLS. Required when `listen` is not a loopback address. `tervano-server cert init --name <host>`
# creates a private CA and these files; or use a certificate from your own PKI.
# tls_cert = 'tls/server.pem'
# tls_key = 'tls/server-key.pem'
# Connection tickets for direct agent access: signing key (created on first start; protect it like a
# TLS key) and lifetime, i.e. how long granted direct access survives a Server outage (5-1440 min).
# ticket_key = 'ticket-key.pk8'
# ticket_minutes = 480
# Device certificates (mutual TLS for agents; needs tls_cert/tls_key). The device CA is created here on
# first start; it is not the CA from `cert init`. Protect its key like a TLS key.
# device_ca_dir = 'device-ca'
# device_cert_days = 90          # agents renew when a third is left
# require_device_certs = false   # true: devices without a certificate are refused (they can still get one)
