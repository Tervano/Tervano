[package]
name = "tervano-server"
description = "Tervano Server: device index, enrollment and event ingestion"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tervano-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
uuid.workspace = true
axum = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
clap = { version = "4", features = ["derive"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto", "x509-parser"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"
