# Service mode reads %ProgramData%\Tervano\Agent\agent.toml.
server_url = "http://127.0.0.1:8470"
# One-time enrollment token from `tervano-server token create`. Only needed until enrolled.
enrollment_token = ""
# Where identity.json is kept. Default: %ProgramData%\Tervano\Agent
# state_dir = 'C:\ProgramData\Tervano\Agent'
# How often local state is checked for changes, and how often a heartbeat is sent when nothing changed.
poll_secs = 15
heartbeat_secs = 60
