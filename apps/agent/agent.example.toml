# Service mode reads %ProgramData%\Tervano\Agent\agent.toml.
# Must be https:// unless the server is on this machine (loopback).
server_url = "https://tervano.example.org:8470"
# PEM CA to trust in addition to the Windows certificate store (e.g. ca.pem from `tervano-server cert init`).
# ca_cert = 'C:\ProgramData\Tervano\Agent\ca.pem'
# One-time enrollment token from `tervano-server token create`. Only needed until enrolled.
enrollment_token = ""
# Where identity.json is kept. Default: %ProgramData%\Tervano\Agent
# state_dir = 'C:\ProgramData\Tervano\Agent'
# How often local state is checked for changes, and how often a heartbeat is sent when nothing changed.
poll_secs = 15
heartbeat_secs = 60

# Direct (serverless) management. Technicians connect straight to this agent with a client
# certificate from `tervano-server cert tech --name <tech>`; the agent's own certificate is
# generated on first start — pin it with `TervanoAgent direct-fingerprint`. Omit server_url
# above to run without a server at all.
# [direct]
# listen = "0.0.0.0:8472"
# technician_ca = 'C:\ProgramData\Tervano\Agent\ca.pem'
# allowed_technicians = ["alice", "bob"]   # read-only access; empty or omitted = any certificate from technician_ca
# operators = ["alice"]                      # may change the machine (terminate processes); empty = nobody

# Server jobs: scripts technicians queue on the server for many devices. They run as this agent's
# account (LocalSystem for the service), so they are off unless enabled here, and only the listed
# server technicians may use them. Other jobs are refused and reported back as refused.
# [server_jobs]
# enabled = true
# technicians = ["alice"]   # or ["*"] for every server technician
