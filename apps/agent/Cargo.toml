[package]
name = "tervano-agent"
description = "Tervano Agent: endpoint service reporting state to Tervano Server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "TervanoAgent"
path = "src/main.rs"

[dependencies]
tervano-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
reqwest.workspace = true
uuid.workspace = true
hex = "0.4"
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false }
tower = "0.5"
futures-util = { version = "0.3", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
x509-parser = "0.18"
sha2 = "0.10"
if-addrs = "0.15"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Security_Cryptography",
] }
