name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Every push to main gets a result; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Testing is deferred (PLAN.md, 2026-10-14), so there is no test job yet; add `cargo test` here when it returns.
jobs:
  windows:
    name: Windows (fmt, clippy, build all)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Registers problem matchers, so compiler/clippy errors show as annotations; also caches.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked

  linux-server:
    name: Linux (server build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
      - run: cargo clippy -p tervano-server -p tervano-protocol --all-targets --locked -- -D warnings
      - run: cargo build -p tervano-server --locked

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          rustflags: ""
      - run: cargo check --workspace --locked
