name: CI

# Paused (2026-10-15): manual runs only until the project is ready, to conserve CI minutes.
# To resume automatic runs, restore:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Every push to main gets a result; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Testing is deferred (PLAN.md, 2026-10-14), so there is no test job yet; add `cargo test` here when it returns.
jobs:
  dependencies:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources
          arguments: --all-features
      # cargo-audit scans every lockfile entry, including SQLx's disabled MySQL
      # backend. Fail if its rsa dependency ever enters a build graph.
      - name: Keep the RSA advisory exception unreachable
        run: |
          if cargo tree --workspace --all-features --target all -e all -i rsa 2>/dev/null | grep -q '^rsa v'; then
            echo 'rsa is now reachable; remove the audit exception and resolve RUSTSEC-2023-0071'
            exit 1
          fi
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071
      - run: python3 scripts/generate-third-party-licenses.py
      - run: git diff --exit-code -- THIRD_PARTY_LICENSES.md

  windows:
    name: Windows (fmt, clippy, build all)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # Registers problem matchers, so compiler/clippy errors show as annotations; also caches.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked

  linux-server:
    name: Linux (server build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          rustflags: ""
      - run: cargo clippy -p tervano-server -p tervano-protocol --all-targets --locked -- -D warnings
      - run: cargo build -p tervano-server --locked

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.90"
          rustflags: ""
      - run: cargo check --workspace --locked
